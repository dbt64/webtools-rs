<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/electron/renderer/plugin-window-chrome.css" />
    <title>Plugin Window</title>
  </head>
  <body>
    <div id="plugin-window-root">
      <header id="plugin-window-titlebar">
        <div class="titlebar-left">
          <img id="plugin-window-icon" alt="" />
          <span id="plugin-window-title"></span>
          <button class="titlebar-button attached-close" data-action="close" aria-label="关闭插件" title="关闭">×</button>
        </div>
        <div class="titlebar-actions">
          <button class="titlebar-button menu-trigger" aria-label="更多操作" title="更多操作">⋮</button>
          <img id="plugin-window-right-icon" class="panel-only-icon" alt="" />
          <button class="titlebar-button detached-only pin-button" data-action="pin" aria-label="置顶" title="置顶" aria-pressed="false" hidden><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg></button>
          <button class="titlebar-button detached-only" data-action="minimize" aria-label="最小化" title="最小化" hidden>−</button>
          <button class="titlebar-button detached-only maximize-button" data-action="toggle-maximize" aria-label="最大化" title="最大化" hidden><svg class="maximize-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/></svg><svg class="restore-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" hidden><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
          <button class="titlebar-button detached-only" data-action="close" aria-label="结束运行" title="结束运行" hidden>×</button>
        </div>
      </header>
      <main id="plugin-window-loading" role="status" aria-live="polite" aria-label="正在打开插件">
        <span class="loading-mark"><img id="plugin-window-loading-icon" alt="" /><span class="loading-spinner" aria-hidden="true"></span></span>
        <span>正在打开插件</span>
      </main>
    </div>
    <script type="module" src="/electron/renderer/plugin-window-chrome.ts"></script>
  </body>
</html>
