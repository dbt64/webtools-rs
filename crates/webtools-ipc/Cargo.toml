[package]
name = "webtools-ipc"
version = "0.1.0"
edition = "2021"
description = "Native <-> manager named-pipe protocol (v1): framing, envelope, handshake."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Memory", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
